  <path d="M318 392 C 372 396 428 420 456 448 C 468 461 462 478 444 478 C 396 478 344 452 310 424 Z" fill="url(#tailg)"/>
  <g stroke="#4A2A15" stroke-width="7" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M352 414 C 366 432 384 448 404 458"/>
    <path d="M388 408 C 402 424 420 438 438 446"/>
    <path d="M336 428 C 350 444 366 456 384 464"/>
  </g>

  <!-- 身体 -->
  <path d="M256 268 C 176 268 148 330 152 388 C 155 430 196 452 256 452 C 316 452 357 430 360 388 C 364 330 336 268 256 268 Z" fill="url(#fur)"/>
  <!-- 肚皮 -->
  <ellipse cx="256" cy="392" rx="62" ry="52" fill="#E8C9A4"/>

  <!-- 脚 -->
  <ellipse cx="210" cy="446" rx="34" ry="15" fill="#5E3820"/>
  <ellipse cx="302" cy="446" rx="34" ry="15" fill="#5E3820"/>


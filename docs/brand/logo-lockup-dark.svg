  <circle cx="172" cy="120" r="30" fill="#9A6B4F"/>
  <circle cx="172" cy="120" r="14" fill="#5E3820"/>
  <circle cx="340" cy="120" r="30" fill="#9A6B4F"/>
  <circle cx="340" cy="120" r="14" fill="#5E3820"/>

  <!-- 头 -->
  <circle cx="256" cy="206" r="112" fill="url(#fur)"/>
  <!-- 脸颊绒毛 -->
  <ellipse cx="256" cy="262" rx="74" ry="56" fill="#D9B08C"/>

  <!-- 眼睛 -->
  <circle cx="212" cy="184" r="15" fill="#33200F"/>
  <circle cx="300" cy="184" r="15" fill="#33200F"/>
  <circle cx="217" cy="178" r="5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="305" cy="178" r="5" fill="#FFFFFF" opacity="0.9"/>
  <!-- 腮红 -->
  <ellipse cx="164" cy="228" rx="16" ry="10" fill="#C98A5C" opacity="0.55"/>
  <ellipse cx="348" cy="228" rx="16" ry="10" fill="#C98A5C" opacity="0.55"/>


<svg xmlns="http://www.w3.org/2000/svg" width="460" height="96" viewBox="0 0 460 96" role="img" aria-label="Beaver">
  <!-- Horizontal lockup, dark backgrounds (GitHub dark mode): beaver scene + wordmark + tagline -->
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="432" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="180" y1="90" x2="330" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B57C52"/>
      <stop offset="1" stop-color="#8A5636"/>
    </linearGradient>
    <linearGradient id="tailg" x1="330" y1="370" x2="460" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C4E2E"/>
      <stop offset="1" stop-color="#5E3820"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,16) scale(0.125)">
<rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#glow)"/>

  <!-- 云 -->
  <g fill="#FFFFFF" opacity="0.22">
    <ellipse cx="92" cy="86" rx="52" ry="18"/>
    <ellipse cx="128" cy="72" rx="36" ry="14"/>
    <ellipse cx="420" cy="130" rx="44" ry="15"/>
  </g>

  <!-- 远处水面 -->
  <rect y="392" width="512" height="120" fill="#FFFFFF" opacity="0.10"/>

  <!-- 坝：木堆 -->
  <g>
    <g fill="#8A5A34">
      <rect x="20" y="404" width="200" height="34" rx="17" transform="rotate(-4 120 421)"/>
      <rect x="8" y="436" width="240" height="36" rx="18"/>
      <rect x="330" y="404" width="180" height="34" rx="17" transform="rotate(4 420 421)"/>
      <rect x="300" y="436" width="210" height="36" rx="18"/>
    </g>
    <g fill="#C8905C">
      <circle cx="34" cy="454" r="17"/>
      <circle cx="316" cy="454" r="18"/>
    </g>
    <g fill="#8A5A34">

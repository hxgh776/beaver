  <path d="M256 210 C 274 210 284 220 284 230 C 284 242 271 248 256 248 C 241 248 228 242 228 230 C 228 220 238 210 256 210 Z" fill="#33200F"/>
  <ellipse cx="249" cy="220" rx="6" ry="3.6" fill="#FFFFFF" opacity="0.35"/>

  <!-- 门牙 -->
  <rect x="234" y="256" width="21" height="58" rx="8" fill="#FFFFFF"/>
  <rect x="257" y="256" width="21" height="58" rx="8" fill="#FFFFFF"/>
  <rect x="254" y="256" width="4" height="58" fill="#D9C4AC" opacity="0.9"/>

  <!-- 抱着的树枝 -->
  <g transform="rotate(-9 256 330)">
    <rect x="110" y="318" width="292" height="26" rx="13" fill="#A9743F"/>
    <rect x="150" y="296" width="12" height="26" rx="6" fill="#8A5A34" transform="rotate(28 156 309)"/>
    <rect x="352" y="298" width="12" height="26" rx="6" fill="#8A5A34" transform="rotate(-24 358 311)"/>
  </g>
  <!-- 爪子 -->
  <circle cx="186" cy="330" r="30" fill="#9A6B4F"/>
  <circle cx="326" cy="318" r="30" fill="#9A6B4F"/>
  <g stroke="#7C4E2E" stroke-width="5" stroke-linecap="round">
    <path d="M176 322 v16"/>
    <path d="M188 320 v18"/>
    <path d="M200 322 v16"/>
    <path d="M316 310 v16"/>
    <path d="M328 308 v18"/>
    <path d="M340 310 v16"/>
  </g>

  <!-- 前景水波 -->
  <path d="M0 470 Q 42 452 85 470 T 170 470 T 256 470 T 341 470 T 426 470 T 512 470 V512 H0 Z" fill="#FFFFFF" opacity="0.20"/>
  <path d="M0 492 Q 42 478 85 492 T 170 492 T 256 492 T 341 492 T 426 492 T 512 492 V512 H0 Z" fill="#FFFFFF" opacity="0.30"/>
  </g>
  <text x="84" y="51" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">
    <tspan fill="#F8FAFC">Bea</tspan><tspan fill="#A5B4FC">ver</tspan>
  </text>
  <text x="85" y="73" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" fill="#94A3B8">Every agent's gear. One dam.</text>
</svg>
